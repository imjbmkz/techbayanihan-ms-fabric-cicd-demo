name: Deploy Fabric items

on:
  push:
    branches: [main]
    paths:
      - "fabric/**"
      - "deploy/**"
      - ".github/workflows/deploy-fabric.yml"
  workflow_dispatch:
    inputs:
      run_pipeline:
        description: "Run pl_nyc_tlc__end_to_end after deploying to QA"
        type: boolean
        default: false

permissions:
  id-token: write   # OIDC token for azure/login (no client secret stored in GitHub)
  contents: read

concurrency:
  group: fabric-deploy
  cancel-in-progress: false

jobs:
  deploy-qa:
    name: Deploy to QA (ws-demo-qa)
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deploy/requirements.txt

      - name: Install deploy dependencies
        run: pip install -r deploy/requirements.txt

      - name: Azure login (service principal via OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Deploy with fabric-cicd
        run: python deploy/deploy.py --environment qa ${{ inputs.run_pipeline && '--run-pipeline' || '' }}

  # Prod is wired up but switched off until you set the repository variable
  # ENABLE_PROD_DEPLOY=true and add a required reviewer on the "prod" environment.
  deploy-prod:
    name: Deploy to Prod (ws-demo-prod)
    needs: deploy-qa
    if: ${{ vars.ENABLE_PROD_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deploy/requirements.txt

      - name: Install deploy dependencies
        run: pip install -r deploy/requirements.txt

      - name: Azure login (service principal via OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Deploy with fabric-cicd
        run: python deploy/deploy.py --environment prod
